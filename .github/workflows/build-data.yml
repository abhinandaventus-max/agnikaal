name: Build harmonized fire tiles

# Re-runs the Agnikaal pipeline on GitHub's network: downloads NASA FIRMS
# MODIS + VIIRS archives, harmonizes them and commits the tiles in public/data.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "FIRMS country names, comma separated"
        default: "India,Argentina,Australia,United_States,Canada"
  schedule:
    - cron: "0 3 1 * *"   # monthly refresh of the live globe sample + any new archive year

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow numpy
      - name: Build tiles
        run: python3 -I pipeline/build_dataset.py --regions "${{ github.event.inputs.regions || 'India,Argentina,Australia,United_States,Canada' }}" --workers 8
      - name: Refresh El Nino index (NOAA ONI)
        run: python3 -I pipeline/fetch_oni.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fingerprints + event catalogue
        run: node pipeline/discover.mjs
      - name: Commit tiles
        run: |
          git config user.name "agnikaal-bot"
          git config user.email "agnikaal-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: rebuild harmonized FIRMS tiles"
          git push
