<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 80" role="img" aria-label="Agnikaal, harmonized fire intelligence">
  <defs>
    <linearGradient id="ak-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/><stop offset="0.6" stop-color="#ffb347"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 8)">
  <defs>
    <linearGradient id="ak-flame" x1="32" y1="46" x2="32" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3d14"/>
      <stop offset="0.55" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="ak-core" x1="32" y1="40" x2="32" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="ak-orbit" x1="5" y1="0" x2="59" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#5ad1ff"/>
    </linearGradient>
    <linearGradient id="ak-limb" x1="6" y1="0" x2="58" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ad1ff"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ak-glow" cx="32" cy="36" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a2b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="35" r="22" fill="url(#ak-glow)"/>
  <!-- orbit, far side (behind the flame) -->
  <ellipse cx="32" cy="32" rx="27" ry="8.5" transform="rotate(-20 32 32)" fill="none" stroke="url(#ak-orbit)" stroke-width="1.6" stroke-opacity="0.35"/>
  <!-- planet limb -->
  <path d="M7 52 A44 44 0 0 1 57 52" fill="none" stroke="url(#ak-limb)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- flame -->
  <path d="M32 6c3.2 8 12.5 13.2 12.5 25.4C44.5 39 39 45 32 45s-12.5-6-12.5-13.6c0-6.3 3.3-10.1 5.9-13.6.6 4.1 2.2 6.7 4.9 8.2-1.1-7 .1-13.6 1.7-20z" fill="url(#ak-flame)"/>
  <path d="M32.3 21.5c2.2 4.7 6.1 7.4 6.1 12.1 0 3.7-2.8 6.6-6.4 6.6s-6.4-2.9-6.4-6.6c0-3.2 2-5.3 3.4-7.1.5 2.3 1.6 3.7 3.1 4.4-.7-3.1-.6-6.3.2-9.4z" fill="url(#ak-core)"/>
  <!-- orbit, near side (in front of the flame) -->
  <ellipse cx="32" cy="32" rx="27" ry="8.5" transform="rotate(-20 32 32)" fill="none" stroke="url(#ak-orbit)" stroke-width="2" pathLength="100" stroke-dasharray="50 50" stroke-linecap="round"/>
  <!-- satellite -->
  <circle cx="47.4" cy="34.6" r="4.6" fill="#5ad1ff" fill-opacity="0.22"/>
  <circle cx="47.4" cy="34.6" r="2.3" fill="#e8f9ff"/>
  </g>
  <text x="84" y="47" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="34" letter-spacing="4.5"><tspan font-weight="300" fill="#eef0f6">AGNI</tspan><tspan font-weight="700" fill="url(#ak-word)">KAAL</tspan></text>
  <text x="86" y="66" font-family="JetBrains Mono, Menlo, monospace" font-size="9" font-weight="500" letter-spacing="1.25" fill="#8fd9ff">HARMONIZED FIRE INTELLIGENCE</text>
</svg>
